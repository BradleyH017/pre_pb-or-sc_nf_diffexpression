experiment_key_column:
    description: 'Column used to group samples to make pseudobulk.'
    value: 'individual_id'
anndata_cell_label:
    description: 'Anndata cell label column in obs slot.'
    value: 'predicted_labels'
differential_expression:
    run_process: true
    # If false, skip all diagnostic/comparison plotting steps (per-model DGE
    # plots, merged DGE plots, and merged GSEA plots) and only run
    # differential expression, merging, and GSEA.
    run_plots: false
    target_variable_placeholder:
        description: 'Token used in models.value formula/variable_target/
            variable_continuous/variable_discrete fields to mark where a
            target variable name should be substituted. Any model containing
            this token will be expanded into one model per line listed in
            target_variable_list_file, with the token replaced by that
            target variable name.'
        value: ''
    target_variable_list_file:
        description: 'Path to a text file with one target variable name per
            line (e.g., C1_clr, C2_clr, ...). Each model in models.value
            that contains target_variable_placeholder is run once per line
            in this file. Set value to "" to disable expansion and run
            models.value exactly as specified.'
        value: ''
    target_x_model_matrix:
        description: 'Path to a tab-separated file with two columns and no
            header: target variable name, and the covariate terms (joined
            by " + ", optionally wrapped in double quotes, e.g. as produced
            by archetype_x_model2.txt) to use as that target variable
            formula right-hand side. If set (non-empty), this takes
            precedence over target_variable_list_file: each row expands any
            model in models.value that contains target_variable_placeholder
            into one model per row, with variable_target/
            variable_continuous/variable_discrete/variable_discrete_level
            substituted as usual, but with formula replaced entirely by
            "~ " followed by that row covariate terms (instead of
            substituting the placeholder into models.value.formula). Set
            value to "" to disable and fall back to target_variable_list_file.'
        value: ''
    models:
        description: 'List of differential formula and params.
            All covariates in formula should be listed in either
                variable_continuous or variable_discrete.'
        mean_cp10k_filter: 0.1
        bulk_or_singlecell: 'single_cell' # Refers to the INPUT data only. 'single_cell' or 'bulk'. If
            # 'bulk', run_differential_expression_bulk is used instead of
            # run_differential_expression: in addition to the mean_cp10k_filter
            # cutoff above, genes are only retained if they have counts >
            # bulk_count_threshold in at least sample_frac_threshold
            # proportion of samples.
        bulk_count_threshold: 5 # only used if bulk_or_singlecell == 'bulk'
        sample_frac_threshold: 0.2 # only used if bulk_or_singlecell == 'bulk'
        value:
            - method: 'deseq::pseudobulk::glmGamPoi'  # for psudobuled data
              formula: '~ chr5_181005024_T_G_dosage + disease_status + disease_status:chr5_181005024_T_G_dosage + age_binned_10 + sex + samp_median_n_genes' # ignored/overridden per row when target_x_model_matrix is set (see above); used as-is otherwise
              variable_target: 'disease_status:chr5_181005024_T_G_dosage' # for the main explanatory variable that we want to test the effect of
              variable_continuous: 'chr5_181005024_T_G_dosage,samp_median_n_genes' # 
              variable_discrete: 'sex,disease_status,age_binned_10'
              variable_discrete_level: 'sex::male,female;;disease_status::Healthy,CD;;age_binned_10::20,30,40,50,60,70' # values are stored as literal True/False strings, not R TRUE/FALSE
              pre_filter_genes: false
              min_obs_per_group: 3 # interaction targets only: min observations (samples if pseudobulk, cells otherwise) per combination of the interacting terms; 0 disables
              publish_pseudobulk: false # if true, publish *_pseudobulk_counts.tsv.gz and *_pseudobulk_log1p_cp10k.tsv.gz (pseudobulk methods only) to the results directory
              proportion_covariate_column: 'predicted_labels'
              include_proportion_covariates: false
    de_merge_config:
        ihw_correction:
            run_process: true
            description: 'Run IHW to correct differential expression results.'
            value:
                covariates: 'cell_label,coef_value'
                alpha: 0.1
    de_plot_config:
        mean_expression_filter:
            description: 'For comparison plots, drop genes whose mean
                expression for a group in anndata_cell_label is < this value.
                Example: if gene A expression is 0 counts in cluster 1 and 10
                in cluster 2, it will be dropped from cluster 1 but not cluster
                2.'
            value:
                - 0.0
                - 0.25
    fgsea_config:
        run_process: true
        description: 'Parameters to run fGSEA.'
        sample_size: 101
        score_type: 'std'
        value:
            - min_set_size: 1
              max_set_size: Inf
              eps: 0
              database: 'c2.cp.reactome,c2.cp.kegg,c5.bp,c5.cc,c5.mf'
    